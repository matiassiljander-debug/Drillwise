function loadScriptOnce(url,globalName){if(globalName&&window[globalName])return Promise.resolve(window[globalName]);return new Promise((res,rej)=>{let s=document.createElement('script');s.src=url;s.async=true;s.onload=()=>res(globalName?window[globalName]:true);s.onerror=()=>rej(new Error('Could not load Excel reader'));document.head.appendChild(s)})}async function ensureXLSX(){return window.XLSX||await loadScriptOnce('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','XLSX')}function parseAOA(aoa){let clean=aoa.map(r=>r.map(c=>String(c??'').trim()));let best=0,score=-1;for(let i=0;i<clean.length;i++){let j=clean[i].join(' ').toLowerCase(),s=0;if(/tvd|depth/.test(j))s+=3;if(/pp|pore/.test(j))s+=2;if(/fg|frac/.test(j))s+=2;if(/shmin|collapse|md|inc|azi/.test(j))s+=2;if(s>score){score=s;best=i}}let h=clean[best].map((c,i)=>c||'Column_'+(i+1));return clean.slice(best+1).filter(r=>r.some(c=>String(c).trim())).map(r=>{let o={};h.forEach((k,i)=>o[k]=Number.isFinite(n(r[i]))?n(r[i]):String(r[i]??'').trim());return o})}function surveySplitLine(line){

function makeSchematicLabelsDraggable(){

  window.addEventListener('mouseup',()=>{

  });

function drawSchematic(){

  svg.push(schemLabel('subtitle',20,58,'Classic subsea vertical schematic | seabed top reference | grey cement blocks',13,'#4f6f82'));
  svg.push(`<line x1="68" y1="${Y(0)}" x2="935" y2="${Y(0)}" stroke="#777" stroke-width="1.6" stroke-dasharray="7,8"/>`);
  svg.push(schemLabel('seabed_label',952,Y(0)+4,'Seabed / top of subsea casing schematic',12,'#111'));

  state.sections.forEach((s,i)=>{
    let y1=Y(s.FromTVD), y2=Y(s.ToTVD), fill=i%2===0?cream:blue1;
    svg.push(`<rect x="${sectionX}" y="${y1}" width="${sectionW}" height="${Math.max(2,y2-y1)}" fill="${fill}" stroke="#e0e9ee"/>`);
    svg.push(schemLabel('section_'+i,810,(y1+y2)/2,`${s.Section} | ${fmt(n(s.FromTVD),0)}-${fmt(n(s.ToTVD),0)} mTVD | MW ${fmt(n(s.MW),2)} SG`,14,dark));
  });

  state.strings.forEach((s,i)=>{
    let hp=half(s.OD), yt=Y(mdToTvd(n(s.TopCementMD))), yb=Y(s.ShoeTVD);
    if(Number.isFinite(yt)&&Number.isFinite(yb)&&yb>yt){let cementW=29;svg.push(`<rect x="${cx-hp-cementW}" y="${yt}" width="${cementW}" height="${yb-yt}" fill="${grey}" stroke="${greyStroke}" stroke-width="1"/><rect x="${cx+hp}" y="${yt}" width="${cementW}" height="${yb-yt}" fill="${grey}" stroke="${greyStroke}" stroke-width="1"/>`)}

  let shoeLabelX=Math.max(40,cx-half(maxOD)-275);

    let dash=type.includes('tieback')?'stroke-dasharray="7,5"':'';
    svg.push(`<line x1="${cx-hp}" y1="${yt}" x2="${cx-hp}" y2="${yb}" stroke="${dark}" stroke-width="5" ${dash}/><line x1="${cx+hp}" y1="${yt}" x2="${cx+hp}" y2="${yb}" stroke="${dark}" stroke-width="5" ${dash}/>`);
    let tri=35;svg.push(`<polygon points="${cx-hp},${yb} ${cx-hp-tri},${yb} ${cx-hp},${yb-tri}" fill="#050505"/><polygon points="${cx+hp},${yb} ${cx+hp+tri},${yb} ${cx+hp},${yb-tri}" fill="#050505"/>`);
    let odText=Number.isFinite(n(s.OD))?fmt(n(s.OD), n(s.OD)%1===0?0:3):'';

    shoeAnchors.push({key:'shoe_'+idx,x:cx-hp,y:yb});
    if(type.includes('liner')){
      let prev=state.strings.filter(p=>n(p.ShoeTVD)>=n(s.TopTVD)&&n(p.OD)>n(s.OD)).sort((a,b)=>n(a.OD)-n(b.OD))[0];

  });

  makeSchematicLabelsDraggable();
}

function tdParseCSV(text){
  let rows=text.split(/\r?\n/).filter(l=>l.trim()); if(!rows.length)return [];
  let parseLine=line=>{let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===','&&!q){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out;};

  return rows.slice(1).map(l=>{let v=parseLine(l),o={};h.forEach((k,i)=>o[k]=v[i]??'');return o;});
}
async function tdImportFile(inp){
  let f=inp&&inp.files&&inp.files[0]; if(!f)return;

    let raw=[];
    if(/\.xlsx?$/i.test(f.name) && typeof ensureXLSX==='function'){
      let X=await ensureXLSX();let wb=X.read(await f.arrayBuffer(),{type:'array'});let ws=wb.Sheets[wb.SheetNames[0]];
      raw=X.utils.sheet_to_json(ws,{defval:''});
    } else raw=tdParseCSV(await f.text());
    let pick=(r,names)=>{let keys=Object.keys(r);let k=keys.find(k=>names.some(n=>k.toLowerCase().replace(/[^a-z0-9]/g,'').includes(n)));return k?r[k]:''};
    state.timeDepth=raw.map(r=>({
      Activity:pick(r,['activity','operation','task']),Section:pick(r,['section','hole']),
      FromMD:pick(r,['frommd','startmd']),ToMD:pick(r,['tomd','endmd']),FromTVD:pick(r,['fromtvd','starttvd']),ToTVD:pick(r,['totvd','endtvd']),
      DurationDays:pick(r,['durationdays','days','duration']),Phase:pick(r,['phase','category']),Comments:pick(r,['comments','note','remarks'])
    })).filter(r=>Object.values(r).some(v=>String(v??'').trim()!==''));

}
function tdPlotRows(basis){
  let rows=tdRowsClean().filter(r=>Number.isFinite(r.DurationDays)&&r.DurationDays>=0);
  let cum=0,out=[];
  rows.forEach((r,i)=>{
    let from=basis==='MD'?r.FromMD:r.FromTVD, to=basis==='MD'?r.ToMD:r.ToTVD;
    if(!Number.isFinite(from)||!Number.isFinite(to))return;
    out.push({day:cum,depth:from,row:r,type:'start'});
    cum+=r.DurationDays;
    out.push({day:cum,depth:to,row:r,type:'end'});
  });
  return out;
}

  let td=Math.max(0,...rows.map(r=>Math.max(Number.isFinite(r.ToMD)?r.ToMD:0,Number.isFinite(r.ToTVD)?r.ToTVD:0)));
  $('tdMetrics').innerHTML=[['Total planned days',total,'days'],['Drilling days',drill,'days'],['Flat / other days',flat,'days'],['Planned TD',td,'m']].map(m=>'<div class="metric"><span class="note">'+m[0]+'</span><br><b>'+fmt(m[1],m[0].includes('days')?1:0)+'</b> '+m[2]+'</div>').join('');
}
function drawTimeDepthPlot(){
  let basis=($('tdBasis')&&$('tdBasis').value)||'MD', showShoes=($('tdShoes')&&$('tdShoes').checked)!==false;
  let pts=tdPlotRows(basis), rows=tdRowsClean();
  let W=1411,H=900,L=96,R=190,T=54,B=82,w=W-L-R,h=H-T-B;
  let maxDay=Math.max(1,...pts.map(p=>p.day));
  let maxDepth=Math.max(100,...pts.map(p=>p.depth),...state.strings.map(s=>basis==='MD'?n(s.ShoeMD):n(s.ShoeTVD)));
  let X=d=>L+d/maxDay*w, Y=dep=>T+dep/maxDepth*h;
  let svg=[];
  svg.push('<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:1411px;min-width:760px;height:auto;background:white;border:1px solid #cfe4ec;border-radius:12px;display:block" xmlns="http://www.w3.org/2000/svg"><rect width="'+W+'" height="'+H+'" fill="white"/>');
  svg.push('<text x="'+L+'" y="'+(T-18)+'" font-family="Segoe UI" font-size="17" font-weight="700" fill="#102a3a">Time vs Depth</text>');
  for(let d=0;d<=maxDay+.001;d+=Math.max(1,Math.ceil(maxDay/10))){svg.push('<line x1="'+X(d)+'" y1="'+T+'" x2="'+X(d)+'" y2="'+(T+h)+'" stroke="#e5eef2"/><text x="'+(X(d)-8)+'" y="'+(T+h+24)+'" font-family="Segoe UI" font-size="11" fill="#607987">'+fmt(d,0)+'</text>')}
  for(let dep=0;dep<=maxDepth;dep+=500){svg.push('<line x1="'+L+'" y1="'+Y(dep)+'" x2="'+(L+w)+'" y2="'+Y(dep)+'" stroke="#e5eef2"/><text x="'+(L-64)+'" y="'+(Y(dep)+4)+'" font-family="Segoe UI" font-size="11" fill="#607987">'+fmt(dep,0)+'</text>')}
  svg.push('<rect x="'+L+'" y="'+T+'" width="'+w+'" height="'+h+'" fill="none" stroke="#102a3a"/>');
  const phaseColour=p=>{p=String(p||'').toLowerCase(); if(p.includes('case'))return '#737373'; if(p.includes('cement'))return '#00a3c7'; if(p.includes('complete'))return '#107c41'; if(p.includes('flat')||p.includes('bop')||p.includes('wellhead'))return '#ff7f0e'; return '#003b5c';};
  for(let i=0;i<pts.length-1;i+=2){let a=pts[i],b=pts[i+1],col=phaseColour(a.row.Phase),tip=(a.row.Activity||'Activity')+' | '+(a.row.Section||'')+' | Day '+fmt(a.day,1)+'-'+fmt(b.day,1)+' | '+basis+' '+fmt(a.depth,0)+'-'+fmt(b.depth,0)+' m | '+fmt(a.row.DurationDays,1)+' days | '+(a.row.Phase||'');svg.push('<line x1="'+X(a.day)+'" y1="'+Y(a.depth)+'" x2="'+X(b.day)+'" y2="'+Y(b.depth)+'" stroke="'+col+'" stroke-width="3" data-tip="'+esc(tip)+'" onmousemove="showPlotTip(event,this.dataset.tip)" onmouseleave="hidePlotTip()"/><circle cx="'+X(b.day)+'" cy="'+Y(b.depth)+'" r="4" fill="'+col+'"><title>'+esc(tip)+'</title></circle>')}
  if(showShoes){state.strings.forEach(s=>{let dep=basis==='MD'?n(s.ShoeMD):n(s.ShoeTVD);if(Number.isFinite(dep)&&dep>0){let label=(s.String||'')+(s.Label?' - '+s.Label:'');let tip=label+' | '+basis+' '+fmt(dep,0)+' m';svg.push('<line x1="'+L+'" y1="'+Y(dep)+'" x2="'+(L+w)+'" y2="'+Y(dep)+'" stroke="#003b5c" stroke-width="1" stroke-dasharray="6,5" data-tip="'+esc(tip)+'" onmousemove="showPlotTip(event,this.dataset.tip)" onmouseleave="hidePlotTip()"/><text x="'+(L+w+10)+'" y="'+(Y(dep)-3)+'" font-family="Segoe UI" font-size="11" fill="#003b5c">'+esc(label)+'</text>')}})}
  svg.push('<text x="'+(L+w/2-45)+'" y="'+(H-30)+'" font-family="Segoe UI" font-size="11" fill="#102a3a">Days from start</text><text transform="translate(24 '+(T+h/2)+') rotate(-90)" font-family="Segoe UI" font-size="11" fill="#102a3a">'+basis+' m</text></svg>');
  $('tdPlot').innerHTML=svg.join('');
  tdMetrics();
}
